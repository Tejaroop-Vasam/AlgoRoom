version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eligible-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword}
      POSTGRES_DB: ${DB_DATABASE:-eligible}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: eligible-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-strongpassword}@postgres:5432/${DB_DATABASE:-eligible}
      PORT: 3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:alpine
    container_name: eligible-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: