services:
  postgres:
    image: postgres:16-alpine
    container_name: algoroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword}
      POSTGRES_DB: ${DB_DATABASE:-algoroom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", ""]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    image: algoroom-api:${RELEASE_TAG:-local}
    build:
      context: .
      target: api
    container_name: algoroom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "host=postgres port=5432"
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-strongpassword}
      PGDATABASE: ${DB_DATABASE:-algoroom}
      PORT: 3000
      RUNNER_URL: http://runner:3001
      REDIS_URL: redis://redis:6379/0
    networks:
      - default
      - execution
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:3000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

  runner:
    image: algoroom-executor:${RELEASE_TAG:-local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      RUNNER_WORKSPACE: ${RUNNER_WORKSPACE:-/tmp/algoroom-runner}
    networks:
      - execution
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_WORKSPACE:-/tmp/algoroom-runner}:${RUNNER_WORKSPACE:-/tmp/algoroom-runner}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:3001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6

  caddy:
    image: caddy:alpine
    container_name: algoroom-caddy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  execution:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
