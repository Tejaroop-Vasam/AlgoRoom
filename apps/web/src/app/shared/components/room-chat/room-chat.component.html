<div #chatLog class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-3 p-3" role="log" aria-label="Chat messages">
  @for (message of messages(); track $index) {
    @let mine = message.user.id === selfId();
    <div class="flex items-end gap-2" [class.flex-row-rev]="mine">
      @if (!mine) {
        <app-avatar size="xs" variant="surface" [name]="message.user.username"></app-avatar>
      }
      <div class="flex flex-col gap-1 min-w-0 max-w-85p" [class.items-end]="mine">
        <span class="flex items-center gap-2 text-xs text-on-surface-variant">
          <span class="font-semibold truncate">{{ mine ? 'You' : message.user.username }}</span>
          <time class="shrink-0 text-muted" [attr.datetime]="message.timestamp">{{ message.timestamp | date:'shortTime' }}</time>
        </span>
        <p class="m-0 px-3 py-2 text-sm break-words chat-bubble"
          [class.chat-bubble-mine]="mine"
          [class.bg-primary]="mine"
          [class.text-on-primary]="mine"
          [class.bg-surface-container-high]="!mine"
          [class.text-on-surface]="!mine">{{ message.message }}</p>
      </div>
    </div>
  } @empty {
    <div class="flex-1 flex flex-col items-center justify-center gap-2 text-center text-muted">
      <app-icon name="chat_bubble_outline" size="lg"></app-icon>
      <span class="text-sm">No messages yet</span>
      <span class="text-xs">Say hello to the room.</span>
    </div>
  }
</div>
<form class="flex items-center gap-2 p-3 border-t border-surface-high" (submit)="send($event)">
  <app-input class="flex-1 min-w-0 input-compact" placeholder="Write a message" [maxLength]="2000"
    [disabled]="!connected()" [(value)]="draft"></app-input>
  <app-button type="submit" variant="primary" icon="send" [iconOnly]="true" ariaLabel="Send message"
    tooltip="Send" [disabled]="!connected() || !draft().trim()"></app-button>
</form>
