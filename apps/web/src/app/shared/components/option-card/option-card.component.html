<div
  role="radio"
  [attr.aria-checked]="selected()"
  [attr.aria-disabled]="disabled() || null"
  [attr.tabindex]="disabled() ? -1 : 0"
  (click)="select()"
  (keydown.enter)="select()"
  (keydown.space)="$event.preventDefault(); select()"
  class="option-card relative d-flex flex-col gap-3 h-full p-4 rounded-lg border transition"
  [class.option-card-selected]="selected()"
  [class.opacity-50]="disabled()"
  [class.cursor-not-allowed]="disabled()"
  [class.cursor-pointer]="!disabled()">

  <span class="option-card-indicator absolute top-0 right-0 m-4 d-flex items-center justify-center rounded-full">
    @if (selected()) {
      <app-icon name="check" size="xs" [weight]="700"></app-icon>
    }
  </span>

  <div class="d-flex items-center gap-3 pr-8">
    @if (icon()) {
      <div class="option-card-icon d-flex items-center justify-center w-10 h-10 rounded-md shrink-0">
        <app-icon [name]="icon()!" size="md"></app-icon>
      </div>
    }
    <div class="d-flex flex-col min-w-0">
      <span class="option-card-title font-sans text-xl font-semibold leading-tight">{{ title() }}</span>
      @if (subtitle()) {
        <span class="option-card-subtitle font-mono text-xs mt-1">{{ subtitle() }}</span>
      }
    </div>
  </div>

  @if (description()) {
    <p class="font-sans text-sm text-on-surface-variant leading-normal m-0">{{ description() }}</p>
  }

  <div class="d-flex flex-wrap gap-2 empty-hidden">
    <ng-content></ng-content>
  </div>
</div>
