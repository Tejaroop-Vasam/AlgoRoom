@if (loadingService.isLoading()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-overlay pointer-events-none select-none">
    <div class="flex flex-col items-center gap-3">
      <img src="/Squares Loader.gif" alt="Loading" class="w-32 h-32 block" />
      @if (text()) {
        <span class="text-xs font-mono text-outline">{{ text() }}</span>
      }
    </div>
  </div>
}
