@if (toasts().length > 0) {
  <aside
    class="fixed z-50 flex flex-col gap-2 pointer-events-none"
    [class]="positionClass()"
    aria-label="Notification alerts"
    aria-live="polite">
    @for (toast of toasts(); track toast.id) {
      <div
        (mouseenter)="onPause(toast.id)"
        (mouseleave)="onResume(toast.id)">
        <app-toast
          [toast]="toast"
          (dismissed)="onDismiss($event)">
        </app-toast>
      </div>
    }
  </aside>
}
