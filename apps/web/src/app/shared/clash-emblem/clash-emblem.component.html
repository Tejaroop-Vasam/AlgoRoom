<button type="button" class="emblem" title="Clash!" aria-label="Replay sword clash animation" (click)="replay()">
  <span class="shield"></span>

  @for (key of [clashKey()]; track key) {
    <svg class="swords" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="blade-shine" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="0.5" stop-color="#e3e8f5" />
          <stop offset="1" stop-color="#aab4cf" />
        </linearGradient>
        <g id="sword">
          <polygon points="12,2 16,10 16,62 8,62 8,10" fill="url(#blade-shine)" stroke="#2b3252" stroke-width="1.5" stroke-linejoin="round" />
          <line x1="12" y1="12" x2="12" y2="58" stroke="#97a3c3" stroke-width="1.5" />
          <rect x="1" y="62" width="22" height="6" rx="3" fill="#ffc93c" stroke="#7a4a00" stroke-width="1.5" />
          <rect x="9" y="68" width="6" height="16" rx="2" fill="#6b3e1d" stroke="#3a1f0b" stroke-width="1.5" />
          <circle cx="12" cy="88" r="5" fill="#ffc93c" stroke="#7a4a00" stroke-width="1.5" />
        </g>
      </defs>

      <g transform="translate(48 15)">
        <g class="sword sword-left"><use href="#sword" /></g>
      </g>
      <g transform="translate(48 15)">
        <g class="sword sword-right"><use href="#sword" /></g>
      </g>

      <circle class="shockwave" cx="60" cy="63" r="10" fill="none" stroke="#ffc93c" stroke-width="3" />
      <polygon
        class="spark"
        points="60,44 64,57 77,54 67,64 75,75 62,69 60,82 56,69 43,75 51,64 41,54 54,57"
        fill="#fff3b0"
        stroke="#ffb300"
        stroke-width="2"
        stroke-linejoin="round" />
    </svg>
  }
</button>
