<section class="w-full max-w-1440 mx-auto px-4 py-8 flex flex-col items-center text-center gap-6">
  <h1 class="text-display tracking-tight font-sans font-bold text-white m-0 text-balance">
    Practice DSA Together
  </h1>
  <p class="max-w-xl text-lg text-on-surface-variant leading-relaxed m-0 text-balance">
    Pick a problem set, invite friends with a room code, and run your solutions in Python, C++, or Java.
  </p>
  <div class="flex justify-center gap-3">
    <app-button variant="primary" size="lg" icon="add_box" iconPosition="start" (clicked)="openCreateRoom()">
      Create Room
    </app-button>
    <app-button variant="outline" size="lg" icon="key" iconPosition="start" (clicked)="openJoinRoom()">
      Join with Code
    </app-button>
  </div>
</section>
