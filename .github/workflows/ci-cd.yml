name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-build:
    name: Build & Verify (Frontend & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/server/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix apps/server

      - name: Build Backend
        run: npm run build --prefix apps/server

      - name: Install Frontend Dependencies
        run: npm ci --prefix apps/web

      - name: Build Frontend
        run: npm run build:pages --prefix apps/web

      - name: Upload Frontend Pages Artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser


  deploy-frontend:
    name: Deploy to GitHub Pages
    needs: ci-build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    name: Deploy Backend to EC2
    needs: ci-build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PROD_ENV_FILE
          script: |
            set -e
            echo "Navigating to project directory..."
            cd ~/AlgoRoom || cd /home/${{ secrets.EC2_USER }}/AlgoRoom || cd ~/Eligible.ai || cd /home/${{ secrets.EC2_USER }}/Eligible.ai

            echo "Pulling latest changes from main..."
            git pull origin main

            echo "Writing production .env file from GitHub Secrets..."
            cd apps/server
            if [ -n "$PROD_ENV_FILE" ]; then
              printf "%s\n" "$PROD_ENV_FILE" > .env
            elif [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi

            echo "Building code runner sandbox images..."
            docker build -t algoroom-runner-cpp:latest ../../infrastructure/docker/runners/cpp
            docker build -t algoroom-runner-python:latest ../../infrastructure/docker/runners/python
            docker build -t algoroom-runner-java:latest ../../infrastructure/docker/runners/java

            echo "Rebuilding and restarting backend container..."
            docker compose -f docker-compose.prod.yml up -d --build server

            echo "Running database migrations inside container..."
            docker compose -f docker-compose.prod.yml exec -T server npm run db:migrate || true

            echo "Pruning dangling docker images to save disk space..."
            docker image prune -f

            echo "Backend deployment complete!"

