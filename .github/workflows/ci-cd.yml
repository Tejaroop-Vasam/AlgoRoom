name: CI/CD Pipeline

on:
  push:
    branches: [main, akhil1]
  pull_request:
    branches: [main, akhil1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify API and build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Install and check Python dependencies
        run: |
          python -m pip install -r apps/server/requirements.txt
          python -m pip check
          python -m compileall -q apps/server/app

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Angular dependencies
        run: npm ci --prefix apps/web

      - name: Build the production Angular bundle
        run: npm run build:pages --prefix apps/web

      - name: Verify Compose startup
        run: |
          cp apps/server/.env.example apps/server/.env
          docker compose -f infrastructure/docker/docker-compose.runners.yml build
          docker compose -f apps/server/docker-compose.prod.yml up -d --build --wait server
          curl --fail --silent --show-error http://127.0.0.1:3000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/problems

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f apps/server/docker-compose.prod.yml logs --no-color

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser

  deploy-backend:
    name: Deploy FastAPI to EC2
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SHA,PROD_ENV_FILE
          script: |
            set -eu
            cd ~/AlgoRoom || cd ~/Eligible.ai
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"

            cd apps/server
            umask 077
            if [ -n "${PROD_ENV_FILE:-}" ]; then
              printf '%s\n' "$PROD_ENV_FILE" > .env
            fi
            if [ ! -s .env ]; then
              echo 'Configure PROD_ENV_FILE or install apps/server/.env on EC2.'
              exit 1
            fi

            export RELEASE_TAG="$DEPLOY_SHA"
            compose() { docker compose -f docker-compose.prod.yml "$@"; }

            docker compose -f ../../infrastructure/docker/docker-compose.runners.yml build
            compose build server runner
            compose up -d --wait --wait-timeout 90 postgres redis runner

            backup_dir="$HOME/algoroom-db-backups"
            mkdir -p "$backup_dir"
            backup_file="$(mktemp "$backup_dir/algoroom-${DEPLOY_SHA}-XXXXXXXX")"
            compose exec -T postgres sh -c 'pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$backup_file"

            compose up -d --no-deps --wait --wait-timeout 90 server
            compose up -d --no-deps caddy
            curl --fail --silent --show-error https://algoroom-api.duckdns.org/health/ready

  deploy-frontend:
    name: Deploy to GitHub Pages
    needs: deploy-backend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
